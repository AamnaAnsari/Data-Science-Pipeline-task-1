name: ML Pipeline CI

# This pipeline will run when you push code to the repository
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # GitHub's cloud server (Linux)

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      # It copies the code to the cloud server

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
      # It installs Python

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
   

    - name: Run Pipeline Test
      run: |
        python test_run.py
      